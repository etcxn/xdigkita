<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">XDigitalKita</title>
  <desc id="desc">Fintech Shield &amp; Digital QRIS Wallet Icon</desc>
  <defs>
    <!-- Modern high-tech cyan-indigo gradient (no pink) -->
    <linearGradient id="shieldGrad" x1="20" y1="20" x2="172" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="50" y1="60" x2="145" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background obsidian squircle -->
  <rect x="8" y="8" width="176" height="176" rx="46" fill="#0b0f19" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="8" y="8" width="176" height="176" rx="46" fill="url(#glassReflection)"/>
  
  <!-- Security Shield with Cyan-Indigo Tech Gradient -->
  <path d="M96 26 L151 49 v42 c0 34-22 59-55 76 -33-17-55-42-55-76 V49 z" fill="url(#shieldGrad)" opacity="0.95"/>
  
  <!-- Clean metallic wallet / QRIS node surface -->
  <path d="M65 68 h62 c9 0 16 7 16 16 v45 c0 9-7 16-16 16 H65 c-9 0-16-7-16-16 V84 c0-9 7-16 16-16 Z" fill="url(#cardGrad)"/>
  <path d="M49 88 h78 c9 0 16 7 16 16 v9 H84 c-10 0-18-8-18-18 0-4 1.3-7.2 3.5-10 Z" fill="#cbd5e1"/>
  <path d="M65 64 c4-8 11-13 20-13 h24 c9 0 17 5 20 13" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Digital node & verification check in high-tech cyan/blue -->
  <circle cx="128" cy="105" r="6" fill="#0284c7"/>
  <circle cx="128" cy="105" r="3" fill="#38bdf8"/>
  <path d="m82 103 8 8 18-19" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
